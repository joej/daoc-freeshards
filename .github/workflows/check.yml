name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - run: python tools/freeshards.py check
      - name: exports/ matches data/ (run `python tools/freeshards.py export` and commit)
        run: |
          python tools/freeshards.py export
          git diff --exit-code -- exports
      - run: pytest -q
